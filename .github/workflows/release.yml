name: Build firmware

on:
  push:
    tags: ['v*']
  workflow_dispatch:   # lets you smoke-test the build without cutting a tag

permissions:
  contents: write      # required for softprops/action-gh-release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # arduino-cli requires the sketch directory's leaf name to match the
      # .ino's basename. The repo is named Hydro-Desktop on GitHub but the
      # sketch is hydro-dash.ino, so we check out into a hydro-dash/ subdir
      # to keep the leaf-name rule satisfied without renaming local files.
      - uses: actions/checkout@v4
        with:
          path: hydro-dash

      - uses: arduino/setup-arduino-cli@v2

      - name: Cache board package + libraries
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-${{ runner.os }}-${{ hashFiles('hydro-dash/.github/workflows/release.yml') }}

      - name: Configure arduino-cli + install ESP32 core
        run: |
          arduino-cli config init --overwrite
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install libraries
        run: |
          arduino-cli lib install \
            "LovyanGFX" "WiFiManager" "ArduinoJson"

      - name: Compile
        working-directory: hydro-dash
        run: |
          # Match build.ps1: PartitionScheme=min_spiffs gives a 1.9 MB
          # app partition, required as of v0.1.9.
          arduino-cli compile \
            --fqbn esp32:esp32:esp32 \
            --board-options PartitionScheme=min_spiffs \
            --warnings default \
            --export-binaries \
            .

      - name: Stage release assets
        working-directory: hydro-dash
        run: |
          set -euo pipefail
          # arduino-cli appends sanitised board-option key=value pairs to
          # the build subdir name.
          BIN_DIR="build/esp32.esp32.esp32_PartitionScheme_min_spiffs"
          TAG="${GITHUB_REF_NAME}"
          mkdir -p dist
          cp "$BIN_DIR/hydro-dash.ino.bin" "dist/hydro-dash-${TAG}.bin"
          cp "$BIN_DIR/hydro-dash.ino.elf" "dist/hydro-dash-${TAG}.elf"
          ls -lh dist

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            hydro-dash/dist/hydro-dash-*.bin
            hydro-dash/dist/hydro-dash-*.elf
          generate_release_notes: true
