name: Build firmware

on:
  push:
    tags: ['v*']
  workflow_dispatch:   # lets you smoke-test the build without cutting a tag

permissions:
  contents: write      # required for softprops/action-gh-release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # arduino-cli requires the sketch directory's leaf name to match the
      # .ino's basename. The repo is named Hydro-Desktop on GitHub but the
      # sketch is hydro-dash.ino, so we check out into a hydro-dash/ subdir
      # to keep the leaf-name rule satisfied without renaming local files.
      - uses: actions/checkout@v5
        with:
          path: hydro-dash

      # arduino/setup-arduino-cli has no Node-24 release yet (latest is v2,
      # which runs on Node 20). GitHub force-runs it on Node 24 from
      # 2026-06-02; bump to v3 once Arduino ships one.
      - uses: arduino/setup-arduino-cli@v2

      - name: Cache board package + libraries
        uses: actions/cache@v5
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-${{ runner.os }}-${{ hashFiles('hydro-dash/.github/workflows/release.yml') }}

      - name: Configure arduino-cli + install ESP32 core
        run: |
          arduino-cli config init --overwrite
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install libraries
        run: |
          # Keep this list in sync with setup.ps1. NimBLE-Arduino is
          # pinned to 2.x — the line compatible with the esp32:esp32 3.x
          # core; 1.4.x compiles but aborts at boot.
          arduino-cli lib install \
            "LovyanGFX" "WiFiManager" "ArduinoJson" "NimBLE-Arduino@2.5.0"

      - name: Compile
        working-directory: hydro-dash
        run: |
          # Match build.ps1: PartitionScheme=min_spiffs gives a 1.9 MB
          # app partition, required as of v0.1.9.
          arduino-cli compile \
            --fqbn esp32:esp32:esp32 \
            --board-options PartitionScheme=min_spiffs \
            --warnings default \
            --export-binaries \
            .

      - name: Stage release assets
        working-directory: hydro-dash
        run: |
          set -euo pipefail
          # --export-binaries drops artifacts in a board-option-suffixed
          # subdir of build/ whose exact name varies with the arduino-cli
          # version and FQBN options, so locate them instead of hardcoding.
          BIN="$(find build -name 'hydro-dash.ino.bin' -print -quit)"
          ELF="$(find build -name 'hydro-dash.ino.elf' -print -quit)"
          if [[ -z "$BIN" || -z "$ELF" ]]; then
            echo "::error::Build artifacts not found under build/"
            find build -type f
            exit 1
          fi
          # The on-device OTA handler refuses any image that lacks the
          # identity marker (FW_ID_MARKER, config.h). The marker is only
          # embedded because ota.cpp references the FWID constant — if a
          # refactor ever severed that reference the linker would GC it
          # and every deployed unit would reject this release. Fail the
          # build instead of shipping an un-flashable image.
          if ! grep -aqF '#FWID#hydro-dash#' "$BIN"; then
            echo "::error::FW_ID_MARKER missing from $BIN — deployed devices would reject this OTA image"
            exit 1
          fi
          TAG="${GITHUB_REF_NAME}"
          mkdir -p dist
          cp "$BIN" "dist/hydro-dash-${TAG}.bin"
          cp "$ELF" "dist/hydro-dash-${TAG}.elf"
          ls -lh dist

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            hydro-dash/dist/hydro-dash-*.bin
            hydro-dash/dist/hydro-dash-*.elf
          generate_release_notes: true
